    <script>
      // 클라우드 프리뷰 컨테이너 내 Vite WebSocket HMR 에러 및 화면 오버레이 억제
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('[vite]')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event.message || '') + (event.error ? (' ' + (event.error.message || '')) : '');
        if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('[vite]')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      if (typeof customElements !== 'undefined') {
        var originalDefine = customElements.define.bind(customElements);
        customElements.define = function(name, constructor, options) {
          if (name === 'vite-error-overlay') {
            class SilentOverlay extends HTMLElement {}
            return originalDefine(name, SilentOverlay, options);
          }
          return originalDefine(name, constructor, options);
        };
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans selection:bg-blue-600 selection:text-white">

  </body>
